<svg xmlns="http://www.w3.org/2000/svg" width="490" height="360" viewBox="0 0 490 360">
  <style>
    .text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #c9d1d9; }
    .label { fill: #2ea043; font-weight: 700; }
    .title { fill: #be55fa; font-weight: 700; font-size: 16px; }
    .line { opacity: 0; animation: fadeIn 0.35s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    .line:nth-child(1) { animation-delay: 0.10s; }
    .line:nth-child(2) { animation-delay: 0.25s; }
    .line:nth-child(3) { animation-delay: 0.40s; }
    .line:nth-child(4) { animation-delay: 0.55s; }
    .line:nth-child(5) { animation-delay: 0.70s; }
    .line:nth-child(6) { animation-delay: 0.85s; }
    .line:nth-child(7) { animation-delay: 1.00s; }
    .line:nth-child(8) { animation-delay: 1.15s; }
  </style>
  <rect width="100%" height="100%" fill="#0d1117" rx="8" />
  <rect x="0.5" y="0.5" width="489" height="359" rx="7" fill="none" stroke="#30363d" />
