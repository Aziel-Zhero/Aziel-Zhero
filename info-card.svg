  <g class="line" transform="translate(20, 150)"><text class="text"><tspan class="label">Location:  </tspan>Pindamonhangaba, SP - Brazil</text></g>
  <g class="line" transform="translate(20, 180)"><text class="text"><tspan class="label">Cert:      </tspan>CEH Master | OSINT</text></g>
  <g class="line" transform="translate(20, 210)"><text class="text"><tspan class="label">Stack:     </tspan>Node.js, React, Python, PHP</text></g>
  <g class="line" transform="translate(20, 240)"><text class="text"><tspan class="label">Database:  </tspan>PostgreSQL, Oracle, Redis</text></g>
  <g class="line" transform="translate(20, 270)"><text class="text"><tspan class="label">Workflow:  </tspan>N8N, Make, Smart Contracts</text></g>
